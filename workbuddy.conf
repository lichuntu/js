/******************************
脚本名称：WorkBuddy 自动签到
Version  : v1.0.0
更新时间：2025.01.01
作者：lichun
Platform : Quantumult X
脚本功能：自动抓取 token 并每日签到
使用说明：添加到重写并在任务里启用
*******************************/

[rewrite_local]
# 抓取运行时明文 token（App 发请求时读请求头）
^https?:\/\/.*(codebuddy\.cn|workbuddy\.cn|workbuddy\.ai)\/ url script-request-header https://raw.githubusercontent.com/lichuntu/js/main/workbuddy_getauth.js

[task_local]
# 每天 08:05 自动签到
5 8 * * * https://raw.githubusercontent.com/lichuntu/js/main/workbuddy_sign.js, tag=WorkBuddy签到, enabled=true

[MITM]
hostname = *.codebuddy.cn, *.workbuddy.cn, *.workbuddy.ai, codebuddy.cn, workbuddy.cn, workbuddy.ai
